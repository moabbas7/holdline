name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.12', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # The visual tests run on Linux only. Elsewhere Playwright has no browser and they skip.
      - name: Install Chromium for the visual tests
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - run: npm test

  attribution:
    name: no AI attribution in commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same patterns as .githooks/pre-push.
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$zero" ] || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_AFTER"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          echo "Checking commits in $range"
          pattern='co-authored-by:.*(claude|anthropic)|claude-session:|generated with \[?claude code'
          bad=0
          for sha in $(git rev-list "$range"); do
            if git log -1 --format=%B "$sha" | grep -Eiq "$pattern"; then
              echo "::error::Commit $sha has an AI attribution line in its message:"
              git log -1 --format=%B "$sha" | grep -Ei "$pattern" | sed 's/^/    /'
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Remove these lines from the commit messages (amend or rebase) and push again."
            exit 1
          fi
          echo "No AI attribution found."
