<!doctype html>
<html><head><meta charset="utf-8"><title>Clock</title>
<style>
body { font-family: sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #222; }
.row { display: flex; gap: 16px; flex-direction: row; }
.box { width: 160px; height: 120px; background: #4a7bd0; color: white; padding: 8px; }
</style></head>
<body>
<h1>Clock</h1>
<div class="row"><div class="box">One</div><div class="box">Two</div><div class="box">Three</div></div>
<p>Some ordinary text on the page so it is clearly not blank.</p>
<p>Time: <span id="clock"></span></p>
<div style="width:40px;height:40px;border:4px solid #ccc;border-top-color:#4a7bd0;border-radius:50%;animation:spin 1s linear infinite"></div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
<script>const c = document.getElementById('clock'); const tick = () => { c.textContent = new Date().toISOString(); }; tick(); setInterval(tick, 100);</script>
</body></html>
