<!doctype html>
<html><head><meta charset="utf-8"><title>Account</title>
<style>
body { font-family: sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #222; }
.row { display: flex; gap: 16px; flex-direction: row; }
.box { width: 160px; height: 120px; background: #4a7bd0; color: white; padding: 8px; }
</style></head>
<body>
<h1>Account</h1>
<p>Status: <b id="user">{{USER}}</b></p>
<script>if (document.getElementById('user').textContent === 'anonymous') console.error('not logged in');
if (!localStorage.getItem('token')) console.error('no token in localStorage');</script>
</body></html>
