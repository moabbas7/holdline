<!doctype html>
<html><head><meta charset="utf-8"><title>Tip</title>
<style>
body { font-family: sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #222; }
.row { display: flex; gap: 16px; flex-direction: row; }
.box { width: 160px; height: 120px; background: #4a7bd0; color: white; padding: 8px; }
</style></head>
<body>
<h1>Tip</h1>
<div class="row"><div class="box">One</div><div class="box">Two</div><div class="box">Three</div></div>
<p>Some ordinary text on the page so it is clearly not blank.</p>
<p id="tip">Tip: short.</p>
<script>
// With the oddload flag, the first load per viewport shows a much longer tip (like a random tip).
const x = new XMLHttpRequest();
x.open('POST', '/count/tip-' + (innerWidth > 800 ? 'desktop' : 'mobile'), false);
x.send();
if ('{{ODDFLAG}}' === '1' && x.responseText === '1') document.getElementById('tip').textContent = 'Tip: a much longer tip that wraps onto several lines. '.repeat(6);
</script>
</body></html>
